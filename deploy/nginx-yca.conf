# Yaounde Urban-Speech Analyzer -- nginx site
#
# Install to /etc/nginx/sites-available/yca and symlink into sites-enabled.
# Replace YOUR_DOMAIN below, then run `certbot --nginx -d YOUR_DOMAIN` which
# will rewrite this file to add the TLS block and the port 80 redirect.
#
# nginx does the things http.server should not be asked to do: TLS, gzip,
# static caching, slow-client buffering and rate limiting.

# Rate limits, so one client cannot monopolise the analyzer. The zones must
# live at http scope; if you already have zones of these names, drop these
# two lines and reuse yours.
limit_req_zone $binary_remote_addr zone=yca_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=yca_page:10m rate=30r/s;

upstream yca_backend {
    server 127.0.0.1:8042 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # Certbot rewrites everything below when TLS is added.

    access_log /var/log/nginx/yca.access.log;
    error_log  /var/log/nginx/yca.error.log;

    # The crest is 1.3 MB; a transcription response is a few KB.
    client_max_body_size 128k;
    client_body_timeout 15s;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    # text/html is deliberately absent: nginx always compresses it when gzip
    # is on, and naming it here produces a "duplicate MIME type" warning.
    gzip_types text/css text/javascript application/javascript application/json;

    # Do not advertise the version to the world.
    server_tokens off;

    add_header X-Content-Type-Options nosniff       always;
    add_header X-Frame-Options        SAMEORIGIN    always;
    add_header Referrer-Policy        no-referrer   always;

    location / {
        limit_req zone=yca_page burst=20 nodelay;
        proxy_pass http://yca_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Analysis is the only route that does real work, so it gets the
    # tighter limit.
    location /api/ {
        limit_req zone=yca_api burst=10 nodelay;
        proxy_pass http://yca_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # The crest never changes during a release, so let the browser keep it.
    location /assets/ {
        proxy_pass http://yca_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host       $host;
        proxy_cache_valid 200 1d;
        expires 1d;
        add_header Cache-Control "public";
    }

    location = /healthz {
        access_log off;
        proxy_pass http://yca_backend;
        proxy_set_header Host $host;
    }
}
